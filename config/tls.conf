# TLS opcional (complemento docker-compose.tls.yml, ver ADR-0003): listener AMQPS na 5671, montado em
# /etc/rabbitmq/conf.d/20-tls.conf. O listener de texto plano (5672) continua ativo; a UI de management (15672) fica
# sem TLS em dev (só em 127.0.0.1). Validar o certificado do servidor é configuração de cada cliente (CA em certs/ca.pem).
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/certs/ca.pem
ssl_options.certfile   = /etc/rabbitmq/certs/server.pem
ssl_options.keyfile    = /etc/rabbitmq/certs/server.key

# Certificado de cliente é verificado se enviado, mas não exigido (a autenticação é por usuário e senha, sem mTLS).
ssl_options.verify               = verify_peer
ssl_options.fail_if_no_peer_cert = false

# Só TLS 1.3 e 1.2 (sem 1.0/1.1); as cifras vêm do padrão do Erlang/OTP, que já exclui RC4, 3DES, NULL e EXPORT.
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
ssl_options.honor_cipher_order = true
