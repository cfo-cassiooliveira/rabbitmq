# Coletor de logs do RabbitMQ (Fluent Bit): arquivo JSON do broker -> GELF TCP no Graylog.
# Destino por variável de ambiente (GELF_HOST, GELF_PORT). Com o destino fora, os registros ficam no buffer em disco e
# são reenviados sem limite de tentativas; os offsets do tail (DB) evitam reler/perder linhas após reinício.

[SERVICE]
    Flush         1
    Grace         10
    # Retry com teto curto (padrão 2000 s): o reenvio após o destino voltar acontece em até ~30 s.
    scheduler.base  2
    scheduler.cap   30
    Log_Level     info
    Parsers_File  parsers.conf
    # API interna (vivacidade, backlog e métricas Prometheus do coletor). Só alcançável pelas redes internas do compose.
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    # Buffer em disco (chunks) e métricas de armazenamento (/api/v1/storage).
    storage.path               /fluent-bit/storage/chunks
    storage.sync               normal
    storage.metrics            On
    storage.backlog.mem_limit  16M

[INPUT]
    Name              tail
    Path              /var/log/rabbitmq/rabbit.log
    Tag               rabbitmq
    Parser            rabbitmq_json
    # Offsets persistentes: após reinício continua de onde parou (Read_from_Head só vale na primeira execução).
    DB                /fluent-bit/storage/tail-rabbit.db
    DB.sync           normal
    Read_from_Head    On
    Rotate_Wait       10
    Refresh_Interval  5
    Skip_Long_Lines   On
    storage.type      filesystem
    Mem_Buf_Limit     8MB

# Minimização (LGPD, Art. IV.6): só time, level e msg seguem adiante; pid, arquivo, linha e domínio são descartados.
[FILTER]
    Name           record_modifier
    Match          rabbitmq
    Allowlist_key  time
    Allowlist_key  level
    Allowlist_key  msg

# GELF exige "level" numérico (syslog): converte "error" etc. antes do envio (ver level.lua).
[FILTER]
    Name    lua
    Match   rabbitmq
    Script  /fluent-bit/etc/level.lua
    Call    to_syslog_level

# "tag" vira service_name no pipeline do Graylog; "host" é obrigatório no GELF.
[FILTER]
    Name    modify
    Match   rabbitmq
    Add     service_name rabbitmq
    Add     tag rabbitmq
    Add     host rabbitmq

[OUTPUT]
    Name                     gelf
    Match                    rabbitmq
    Host                     ${GELF_HOST}
    Port                     ${GELF_PORT}
    Mode                     tcp
    Gelf_Short_Message_Key   msg
    Gelf_Host_Key            host
    # Sem limite de tentativas: nada é descartado por falha do destino.
    Retry_Limit              no_limits
    # Teto do buffer em disco para este destino (acima disso descarta o chunk mais antigo, em vez de encher o volume).
    storage.total_limit_size 200M
