# Configuração do broker RabbitMQ 4.x (single-node, desenvolvimento local). Ver docs/adr/0001 a 0003.

# Listeners: o bind 0.0.0.0 é dentro do container; o compose publica as portas só em 127.0.0.1.
listeners.tcp.default = 5672
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# "loopback_users" fica no padrão (guest só por loopback) como defesa em profundidade; o guest é removido pelo provisionador.

# Memória: watermark absoluto abaixo do mem_limit (1g) do container, senão o OOM killer atua antes do alarme.
vm_memory_high_watermark.absolute = 600MiB
# Disco: o alarme bloqueia publicadores antes de encher o volume.
disk_free_limit.absolute = 1GB

# Topologia declarativa: importa o arquivo gerado por scripts/render-definitions.sh a cada boot em que ele mudou.
# O import é aditivo: o que sumiu do arquivo é removido pelo provisionador (provisioning/provision.sh).
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true

# Métricas Prometheus (plugin rabbitmq_prometheus) em 15692; o compose publica a porta só em 127.0.0.1.
# Métricas por objeto (fila, conexão): poucos objetos em dev, então o volume de saída é aceitável (a doc avisa para ambientes grandes).
prometheus.return_per_object_metrics = true
# A UI de management e as estatísticas de fila da API (usadas pelo smoke) dependem do coletor interno, marcado como
# deprecado: o aviso no boot é esperado e persiste mesmo com a permissão explícita (desligar o coletor remove as
# estatísticas da API, testado). A permissão mantém o funcionamento se a próxima versão menor deixar de permitir por padrão.
# Revisar quando a feature for removida (versão major futura).
deprecated_features.permit.management_metrics_collection = true

# Logs: arquivo JSON em volume (lido pelo coletor log-shipper, que reenvia ao Graylog) e console JSON (docker logs).
# Nível info: nunca debug por padrão (sem conteúdo de mensagens nem credenciais).
log.file = rabbit.log
log.file.level = info
log.file.formatter = json
log.file.rotation.size = 10485760
log.file.rotation.count = 5
log.file.rotation.compress = true
log.console = true
log.console.level = info
log.console.formatter = json
